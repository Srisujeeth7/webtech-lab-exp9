
<!DOCTYPE html>
<html lang="en" ng-app="ngoApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HopeHands NGO - Together We Can Change Lives</title>

    <!-- AngularJS and AngularJS Routing -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8f5;
            color: #26352b;
            line-height: 1.6;
        }

        /* HEADER */

        header {
            background: #14532d;
            color: white;
            padding: 18px 7%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .logo span {
            color: #86efac;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 5px;
            font-size: 14px;
        }

        nav a:hover,
        nav a.active {
            background: #16a34a;
        }

        /* GENERAL */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .heading {
            color: #166534;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .subheading {
            color: #64748b;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #15803d;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .btn:hover {
            background: #166534;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* HERO */

        .hero {
            background:
                linear-gradient(rgba(10,60,30,0.78),
                rgba(10,60,30,0.78)),
                url("https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?w=1600");

            background-size: cover;
            background-position: center;
            min-height: 470px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 19px;
            margin-bottom: 25px;
        }

        .hero .btn {
            background: #facc15;
            color: #14532d;
        }

        /* CARDS */

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            margin-top: 25px;
        }

        .card {
            background: #f0fdf4;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #dcfce7;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h3 {
            color: #166534;
            margin-bottom: 10px;
        }

        .emoji {
            font-size: 45px;
            margin-bottom: 10px;
        }

        /* STATISTICS */

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .stat-card {
            background: #166534;
            color: white;
            padding: 25px;
            border-radius: 9px;
            text-align: center;
        }

        .stat-card h2 {
            font-size: 32px;
            color: #bbf7d0;
        }

        /* FORM */

        .form-container {
            max-width: 750px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .form-title {
            text-align: center;
            color: #166534;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .form-description {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #334155;
        }

        .required {
            color: red;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #16a34a;
            box-shadow: 0 0 4px rgba(22,163,74,0.2);
        }

        .radio-group {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: normal;
            margin: 0;
        }

        .radio-group input {
            width: auto;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            padding: 18px;
            border-radius: 7px;
            margin-top: 20px;
        }

        .invalid {
            border-color: #dc2626;
        }

        .form-note {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        /* CONTACT */

        .contact-box {
            background: #f0fdf4;
            padding: 22px;
            border-radius: 9px;
            margin-bottom: 15px;
        }

        /* FOOTER */

        footer {
            background: #14532d;
            color: white;
            padding: 35px 20px;
            text-align: center;
            margin-top: 50px;
        }

        footer h2 {
            margin-bottom: 10px;
        }

        footer p {
            margin: 6px;
        }

        @media(max-width: 650px) {

            header {
                padding: 15px;
            }

            .navbar {
                justify-content: center;
            }

            nav {
                justify-content: center;
            }

            .hero h1 {
                font-size: 32px;
            }

            .container,
            .form-container {
                margin: 20px 10px;
                padding: 20px;
            }
        }
    </style>
</head>

<body ng-controller="MainController">

                Hope<span>Hands</span> NGO

            <nav>

                <a href="#!/home"
                   ng-class="{active: currentPage === '/home'}">

                <a href="#!/about"

                <a href="#!/programs"

                <a href="#!/register"

                </a>

                <a href="#!/contact"

    <!-- ANGULARJS ROUTING VIEW -->

    <main ng-view></main>


    <!-- FOOTER -->

        <h2>HopeHands NGO</h2>

        <p>Together, We Can Change Lives.</p>

        <p>Helping communities through education, healthcare and social welfare.</p>

        <p>Reg. No.: URK24CS1214</p>

        <p>© 2026 HopeHands NGO. All Rights Reserved.</p>

    </footer>

    <!-- REGISTRATION PAGE TEMPLATE -->

    <script type="text/ng-template" id="register.html">

        <div class="form-container"
             ng-controller="RegistrationController">

            <h1 class="form-title">
                Volunteer Registration
            </h1>

            <p class="form-description">
                Become a part of HopeHands NGO.
                Register today and help make a difference!
            </p>

            <form name="registrationForm"
                  ng-submit="submitForm()"
                  novalidate>

                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Name <span class="required">*</span>
                    </label>

                    <input type="text"
                           name="name"
                           ng-model="user.name"
                           ng-pattern="/^[A-Za-z ]+$/"
                           placeholder="Enter your full name"
                           required
                           ng-class="{'invalid': registrationForm.name.$invalid && registrationForm.name.$touched}">

                    <div class="error"
                         ng-show="registrationForm.name.$touched && registrationForm.name.$error.required">

                        Name is required.

                    </div>

                    <div class="error"
                         ng-show="registrationForm.name.$touched && registrationForm.name.$error.pattern">

                        Name should not contain numbers or special characters.

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password <span class="required">*</span>
                    </label>

                    <input type="password"
                           name="password"
                           ng-model="user.password"
                           ng-pattern="/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}$/"
                           placeholder="Enter password"
                           required
                           ng-class="{'invalid': registrationForm.password.$invalid && registrationForm.password.$touched}">

                    <div class="error"
                         ng-show="registrationForm.password.$touched && registrationForm.password.$error.required">

                        Password is required.

                    </div>

                    <div class="error"
                         ng-show="registrationForm.password.$touched && registrationForm.password.$error.pattern">

                        Password must contain at least 8 characters,
                        one uppercase letter, one lowercase letter
                        and one number.

                    </div>

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label>
                        Age <span class="required">*</span>
                    </label>

                    <input type="number"
                           name="age"
                           ng-model="user.age"
                           min="18"
                           max="30"
                           step="1"
                           placeholder="Enter your age"
                           required
                           ng-class="{'invalid': registrationForm.age.$invalid && registrationForm.age.$touched}">

                    <div class="error"
                         ng-show="registrationForm.age.$touched && registrationForm.age.$error.required">

                        Age is required.

                    </div>

                    <div class="error"
                         ng-show="registrationForm.age.$touched && (registrationForm.age.$error.min || registrationForm.age.$error.max || registrationForm.age.$error.number || registrationForm.age.$error.step)">

                        Age must be a whole number between 18 and 30.

                    </div>

                </div>


                <!-- MOBILE NUMBER -->

                <div class="form-group">

                    <label>
                        Mobile Number <span class="required">*</span>
                    </label>

                    <input type="tel"
                           name="mobile"
                           ng-model="user.mobile"
                           ng-pattern="/^[0-9]{10}$/"
                           maxlength="10"
                           placeholder="Enter 10 digit mobile number"
                           required
                           ng-class="{'invalid': registrationForm.mobile.$invalid && registrationForm.mobile.$touched}">

                    <div class="error"
                         ng-show="registrationForm.mobile.$touched && registrationForm.mobile.$error.required">

                        Mobile number is required.

                    </div>

                    <div class="error"
                         ng-show="registrationForm.mobile.$touched && registrationForm.mobile.$error.pattern">

                        Mobile number must contain exactly 10 digits.

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email <span class="required">*</span>
                    </label>

                    <input type="email"
                           name="email"
                           ng-model="user.email"
                           placeholder="Enter your email address"
                           required
                           ng-class="{'invalid': registrationForm.email.$invalid && registrationForm.email.$touched}">

                    <div class="error"
                         ng-show="registrationForm.email.$touched && registrationForm.email.$error.required">

                        Email is required.

                    </div>

                    <div class="error"
                         ng-show="registrationForm.email.$touched && registrationForm.email.$error.email">

                        Please enter a valid email address.

                    </div>

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label>
                        Gender <span class="required">*</span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   ng-model="user.gender"
                                   value="Male"
                                   required>
                            Male
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   ng-model="user.gender"
                                   value="Female"
                                   required>
                            Female
                        </label>

                    </div>

                    <div class="error"
                         ng-show="registrationForm.gender.$touched && registrationForm.gender.$error.required">

                        Please select your gender.

                    </div>

                </div>


                <!-- STATE -->

                <div class="form-group">

                    <label>
                        State <span class="required">*</span>
                    </label>

                    <select name="state"
                            ng-model="user.state"
                            required>

                        <option value="">Select your state</option>

                        <option>Tamil Nadu</option>
                        <option>Kerala</option>
                        <option>Karnataka</option>
                        <option>Andhra Pradesh</option>
                        <option>Telangana</option>
                        <option>Maharashtra</option>
                        <option>Delhi</option>
                        <option>Gujarat</option>
                        <option>Rajasthan</option>
                        <option>West Bengal</option>
                        <option>Uttar Pradesh</option>
                        <option>Madhya Pradesh</option>

                    </select>

                    <div class="error"
                         ng-show="registrationForm.state.$touched && registrationForm.state.$error.required">

                        Please select your state.

                    </div>

                </div>


                <!-- SUBMIT BUTTON -->

                <div style="text-align:center; margin-top:25px;">

                    <button type="submit"
                            class="btn"
                            ng-disabled="registrationForm.$invalid">

                        Submit Registration

                    </button>

                </div>

            </form>


            <!-- SUCCESS MESSAGE -->

            <div class="success" ng-if="submitted">

                <h3>Registration Successful!</h3>

                <p>Thank you for joining HopeHands NGO.</p>

                <p><strong>Name:</strong> {{registeredUser.name}}</p>

                <p><strong>Email:</strong> {{registeredUser.email}}</p>

                <p><strong>Mobile:</strong> {{registeredUser.mobile}}</p>

                <p><strong>Gender:</strong> {{registeredUser.gender}}</p>

                <p><strong>State:</strong> {{registeredUser.state}}</p>

            </div>

        </div>

    </script>


    <!-- CONTACT PAGE TEMPLATE -->

    <script type="text/ng-template" id="contact.html">

    <!-- ANGULARJS APPLICATION AND ROUTING -->

    <script>

        var app = angular.module("ngoApp", ["ngRoute"]);


        // ROUTING CONFIGURATION

        app.config(function($routeProvider, $locationProvider) {

            $locationProvider.hashPrefix("!");

            $routeProvider

                .when("/home", {
                    templateUrl: "home.html"
                })

                .when("/about", {
                    templateUrl: "about.html"
                })

                .when("/programs", {
                    templateUrl: "programs.html"
                })

                .when("/register", {
                    templateUrl: "register.html"
                })

                .when("/contact", {
                    templateUrl: "contact.html"
                })

                .otherwise({
                    redirectTo: "/home"
                });

        });


        // MAIN CONTROLLER

        app.controller("MainController", function($scope, $location) {

            function updatePage() {
                $scope.currentPage = $location.path();
            }

            updatePage();

            $scope.$on("$routeChangeSuccess", function() {
                updatePage();
            });

        });


        // REGISTRATION FORM CONTROLLER

        app.controller("RegistrationController", function($scope) {

            $scope.user = {};

            $scope.submitted = false;

            $scope.registeredUser = {};


            $scope.submitForm = function() {

                if ($scope.registrationForm.$valid) {

                    // Copy the form data except password

                    $scope.registeredUser = {
                        name: $scope.user.name,
                        age: $scope.user.age,
                        mobile: $scope.user.mobile,
                        email: $scope.user.email,
                        gender: $scope.user.gender,
                        state: $scope.user.state
                    };

                    $scope.submitted = true;

                }

            };

        });

    </script>

</body>
</html>
